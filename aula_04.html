<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Matrícula - FATEC</title>
</head>
<body>

    <header>
        <h1>Matrícula FATEC 2026</h1>
    </header>

    <main>
        <form action="#" method="post">
            
            <fieldset>
                <legend>Dados Pessoais</legend>
                
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required minlength="5"><br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br><br>

                <label for="nascimento">Data de nascimento:</label>
                <input type="date" id="nascimento" name="nascimento"><br><br>

                <label for="cpf">CPF (000.000.000-00):</label>
                <input type="text" id="cpf" name="cpf" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00">
            </fieldset>

            <br>

            <fieldset>
                <legend>Dados Acadêmicos</legend>

                <label for="curso">Curso:</label>
                <select id="curso" name="curso">
                    <option value="ads">Análise e Desenv. de Sistemas</option>
                    <option value="ge">Gestão Empresarial</option>
                    <option value="log">Logística</option>
                </select><br><br>

                <label>Período:</label><br>
                <input type="radio" id="manha" name="periodo" value="manha">
                <label for="manha">Manhã</label>
                <input type="radio" id="noite" name="periodo" value="noite">
                <label for="noite">Noite</label><br><br>

                <input type="checkbox" id="programou" name="programou">
                <label for="programou">Já programou antes?</label>
            </fieldset>

            <br>

            <label for="obs">Observações:</label><br>
            <textarea id="obs" name="obs" rows="4" cols="50"></textarea>

            <br><br>

            <button type="submit">Enviar Matrícula</button>

        </form>
    </main>

</body>
</html>
